<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>Executive Hub Pro</title>
    <style>
        /* Полный сброс настроек и фиксация экрана */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b071e;
        }

        /* Яркий, контрастный неоновый фон без использования фильтров размытия */
        body {
            background: radial-gradient(circle at 50% 25%, #23154c 0%, #0c071f 60%, #05030d 100%);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Контейнер приложения во весь экран смартфона */
        .app-shell {
            width: 100vw;
            height: 100vh;
            max-width: 460px;
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            background: rgba(10, 6, 26, 0.65);
            border-left: 1px solid rgba(255, 255, 255, 0.05);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
            z-index: 10;
        }

        /* Шапка */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .app-title {
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        .status-badge {
            background: rgba(0, 240, 255, 0.15);
            border: 1px solid #00f0ff;
            color: #00f0ff;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
        }

        /* Контрастные и четкие Табы (Высота 50px под палец) */
        .tabs-nav {
            display: flex;
            background: #05030d;
            padding: 4px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            margin-bottom: 24px;
            height: 50px;
        }

        .tab-trigger {
            flex: 1;
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.4);
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            border-radius: 10px;
            outline: none;
            transition: all 0.2s ease;
        }

        /* Активный таб теперь ярко выделяется */
        .tab-trigger.active {
            background: #23154c;
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Контентные блоки */
        .panel-content {
            display: none;
            flex-direction: column;
            gap: 16px;
            flex-grow: 1;
        }

        .panel-content.active {
            display: flex;
        }

        /* Карточки бизнес-метрик */
        .card-metric {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 18px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .metric-details h4 {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 6px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .metric-num {
            font-size: 24px;
            font-weight: 700;
            color: #ffffff;
        }

        .ring-holder {
            position: relative;
            width: 52px;
            height: 52px;
        }

        .ring-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 11px;
            font-weight: 700;
        }

        /* Таск-менеджер */
        .input-bar {
            display: flex;
            gap: 8px;
            background: #05030d;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 6px;
        }

        .input-bar input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 16px;
            padding-left: 12px;
        }

        .input-bar input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .btn-add {
            background: linear-gradient(135deg, #00f0ff, #7000ff);
            border: none;
            color: #ffffff;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
        }

        .tasks-scroll {
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex-grow: 1;
            overflow-y: auto;
        }

        .item-task {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 16px;
            border-radius: 14px;
            cursor: pointer;
        }

        .box-check {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 5px;
            margin-right: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
        }

        .item-task.completed .box-check {
            background: #ff007f;
            border-color: #ff007f;
            box-shadow: 0 0 8px rgba(255, 0, 127, 0.4);
        }

        .box-check::after {
            content: '✓';
            color: white;
            font-size: 12px;
            display: none;
            font-weight: bold;
        }

        .item-task.completed .box-check::after {
            display: block;
        }

        .text-task {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.9);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .item-task.completed .text-task {
            text-decoration: line-through;
            color: rgba(255, 255, 255, 0.3);
        }

        /* Главная кнопка синхронизации */
        .btn-sync {
            width: 100%;
            background: linear-gradient(135deg, #00f0ff 0%, #7000ff 100%);
            border: none;
            color: #ffffff;
            padding: 16px;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(112, 0, 255, 0.3);
            margin-top: auto;
            flex-shrink: 0;
        }

        .btn-sync:active {
            transform: scale(0.98);
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="app-shell">
        <!-- Шапка -->
        <div class="app-header">
            <div class="app-title">Performance Hub</div>
            <div class="status-badge" id="indicator">Live</div>
        </div>

        <!-- Навигация -->
        <div class="tabs-nav">
            <button class="tab-trigger active" id="trigger-metrics">Метрики бизнеса</button>
            <button class="tab-trigger" id="trigger-tasks">Задачи команды</button>
        </div>

        <!-- Метрики -->
        <div class="panel-content active" id="panel-metrics">
            <div class="card-metric">
                <div class="metric-details">
                    <h4>Маржинальный доход (P&L)</h4>
                    <div class="metric-num" id="pnl-display">34,500 BYN</div>
                </div>
                <div class="ring-holder">
                    <svg width="52" height="52">
                        <circle cx="26" cy="26" r="22" fill="transparent" stroke="rgba(255,255,255,0.05)" stroke-width="3.5"/>
                        <circle cx="26" cy="26" r="22" fill="transparent" stroke="#00f0ff" stroke-width="3.5" stroke-dasharray="138.2" stroke-dashoffset="34.5"/>
                    </svg>
                    <div class="ring-text" style="color: #00f0ff;">75%</div>
                </div>
            </div>

            <div class="card-metric">
                <div class="metric-details">
                    <h4>Эффективность (KPI)</h4>
                    <div class="metric-num">92.4%</div>
                </div>
                <div class="ring-holder">
                    <svg width="52" height="52">
                        <circle cx="26" cy="26" r="22" fill="transparent" stroke="rgba(255,255,255,0.05)" stroke-width="3.5"/>
                        <circle cx="26" cy="26" r="22" fill="transparent" stroke="#ff007f" stroke-width="3.5" stroke-dasharray="138.2" stroke-dashoffset="11.0"/>
                    </svg>
                    <div class="ring-text" style="color: #ff007f;">92%</div>
                </div>
            </div>
        </div>

        <!-- Задачи -->
        <div class="panel-content" id="panel-tasks">
            <div class="input-bar">
                <input type="text" id="task-entry" placeholder="Новое поручение..." maxlength="35">
                <button class="btn-add" id="btn-add-item">+</button>
