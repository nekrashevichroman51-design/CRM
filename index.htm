<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fixed Executive Widget</title>
    <style>
        /* Базовый сброс стилей */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: radial-gradient(circle at 50% 30%, #171030 0%, #05030a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        /* Декоративные неоновые сферы на фоне */
        body::before, body::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            z-index: 0;
            opacity: 0.45;
        }
        body::before {
            width: 250px;
            height: 250px;
            background: #ff007f;
            top: 20%;
            left: 15%;
        }
        body::after {
            width: 300px;
            height: 300px;
            background: #00f0ff;
            bottom: 20%;
            right: 15%;
        }

        /* Надежный Glassmorphism контейнер с четкими размерами */
        .widget {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.09);
            border-radius: 24px;
            width: 100%;
            max-width: 360px; /* Идеальный размер под любой смартфон */
            min-height: 380px;
            padding: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            z-index: 10;
            color: #ffffff;
            display: flex;
            flex-direction: column;
        }

        /* Шапка */
        .widget-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .widget-title {
            font-size: 18px;
            font-weight: 600;
            background: linear-gradient(45deg, #ffffff, #b4b2ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-badge {
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid rgba(0, 240, 255, 0.3);
            color: #00f0ff;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }

        /* Стабильные Табы */
        .tabs {
            display: flex;
            background: rgba(0, 0, 0, 0.3);
            padding: 4px;
            border-radius: 12px;
            margin-bottom: 16px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.5);
            padding: 10px 0;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 8px;
            outline: none;
        }

        .tab-btn.active {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
        }

        /* Контентные панели */
        .tab-content {
            display: none;
            flex-direction: column;
            gap: 10px;
            flex-grow: 1;
        }

        .tab-content.active {
            display: flex;
        }

        /* Метрики бизнеса */
        .metric-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 14px;
            padding: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .metric-info h4 {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 2px;
            font-weight: 400;
        }

        .metric-value {
            font-size: 18px;
            font-weight: 700;
        }

        .progress-ring-container {
            position: relative;
            width: 44px;
            height: 44px;
        }

        .progress-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 10px;
            font-weight: 700;
        }

        /* Таск-менеджер */
        .task-input-wrapper {
            display: flex;
            gap: 6px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            padding: 4px;
        }

        .task-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 13px;
            padding-left: 8px;
        }

        .task-input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .add-task-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #ffffff;
            width: 28px;
            height: 28px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        .tasks-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 140px;
            overflow-y: auto;
        }

        .task-item {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            padding: 10px 12px;
            border-radius: 10px;
            cursor: pointer;
        }

        .checkbox-custom {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            margin-right: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
        }

        .task-item.completed .checkbox-custom {
            background: #ff007f;
            border-color: #ff007f;
        }

        .checkbox-custom::after {
            content: '✓';
            color: #ffffff;
            font-size: 10px;
            display: none;
        }

        .task-item.completed .checkbox-custom::after {
            display: block;
        }

        .task-text {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.8);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .task-item.completed .task-text {
            text-decoration: line-through;
            color: rgba(255, 255, 255, 0.3);
        }

        /* Главная кнопка внизу */
        .action-btn {
            width: 100%;
            background: linear-gradient(135deg, #00f0ff 0%, #7000ff 100%);
            border: none;
            color: #ffffff;
            padding: 12px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 16px;
            box-shadow: 0 4px 15px rgba(112, 0, 255, 0.2);
        }
    </style>
</head>
<body>

    <div class="widget">
        <!-- Шапка -->
        <div class="widget-header">
            <div class="widget-title">Performance Hub</div>
            <div class="status-badge" id="live-indicator">Live</div>
        </div>

        <!-- Табы -->
        <div class="tabs">
            <button class="tab-btn active" id="btn-metrics">Метрики бизнеса</button>
            <button class="tab-btn" id="btn-tasks">Задачи команды</button>
        </div>

        <!-- Контент 1: Метрики -->
        <div class="tab-content active" id="content-metrics">
            <div class="metric-card">
                <div class="metric-info">
                    <h4>Маржинальный доход (P&L)</h4>
                    <div class="metric-value" id="pnl-text">34,500 BYN</div>
                </div>
                <div class="progress-ring-container">
                    <svg width="44" height="44">
                        <circle cx="22" cy="22" r="18" fill="transparent" stroke="rgba(255,255,255,0.05)" stroke-width="3"/>
                        <circle cx="22" cy="22" r="18" fill="transparent" stroke="#00f0ff" stroke-width="3" stroke-dasharray="113" stroke-dashoffset="28"/>
                    </svg>
                    <div class="progress-text" style="color: #00f0ff;">75%</div>
                </div>
            </div>

            <div class="metric-card">
                <div class="metric-info">
                    <h4>Эффективность команды (KPI)</h4>
                    <div class="metric-value">92.4%</div>
                </div>
                <div class="progress-ring-container">
                    <svg width="44" height="44">
                        <circle cx="22" cy="22" r="18" fill="transparent" stroke="rgba(255,255,255,0.05)" stroke-width="3"/>
                        <circle cx="22" cy="22" r="18" fill="transparent" stroke="#ff007f" stroke-width="3" stroke-dasharray="113" stroke-dashoffset="10"/>
                    </svg>
                    <div class="progress-text" style="color: #ff007f;">92%</div>
                </div>
            </div>
        </div>

        <!-- Контент 2: Задачи -->
        <div class="tab-content" id="content-tasks">
            <div class="task-input-wrapper">
                <input type="text" class="task-input" id="task-input" placeholder="Новая задача..." maxlength="40">
