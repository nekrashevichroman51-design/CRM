<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <!-- Жесткая фиксация масштаба 1:1, запрещающая браузеру отдалять страницу -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>Executive Web App</title>
    <style>
        /* Блокировка прокрутки и адаптация под экран смартфона */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #090514;
        }

        body {
            background: radial-gradient(circle at 50% 20%, #1c133a 0%, #06040b 100%);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Декоративные неоновые пятна на фоне */
        .bg-glow {
            position: absolute;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            z-index: 1;
        }
        .glow-1 { background: #ff007f; top: 10%; left: 10%; }
        .glow-2 { background: #00f0ff; bottom: 15%; right: 10%; }

        /* Интерфейс приложения растягивается на весь экран смартфона */
        .app-container {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            max-width: 480px; /* Ограничение для ПК, на телефоне будет во весь экран */
            padding: 20px;
            display: flex;
            flex-direction: column;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-left: 1px solid rgba(255, 255, 255, 0.05);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Шапка с крупными элементами */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
        }

        .app-title {
            font-size: 20px;
            font-weight: 700;
            color: #ffffff;
            background: linear-gradient(45deg, #ffffff, #b4b2ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-badge {
            background: rgba(0, 240, 255, 0.12);
            border: 1px solid rgba(0, 240, 255, 0.4);
            color: #00f0ff;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Крупные мобильные Табы (высота 50px под палец) */
        .tabs {
            display: flex;
            background: rgba(0, 0, 0, 0.4);
            padding: 4px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 20px;
            height: 50px;
        }

        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.4);
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            border-radius: 12px;
            outline: none;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background: rgba(255, 255, 255, 0.12);
            color: #ffffff;
        }

        /* Панели контента занимают всю оставшуюся высоту */
        .tab-content {
            display: none;
            flex-direction: column;
            gap: 14px;
            flex-grow: 1;
        }

        .tab-content.active {
            display: flex;
        }

        /* Карточки метрик бизнеса */
        .metric-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 18px;
            padding: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .metric-info h4 {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 4px;
            font-weight: 500;
        }

        .metric-value {
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
        }

        .progress-ring-container {
            position: relative;
            width: 48px;
            height: 48px;
        }

        .progress-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 11px;
            font-weight: 700;
        }

        /* Мобильный таск-менеджер */
        .task-input-wrapper {
            display: flex;
            gap: 8px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 6px;
        }

        /* Шрифт 16px предотвращает автоматический зум экрана на iOS/Android при фокусе */
        .task-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 16px;
            padding-left: 10px;
        }

        .task-input::placeholder {
            color: rgba(255, 255, 255, 0.25);
        }

        .add-task-btn {
            background: linear-gradient(135deg, #00f0ff, #7000ff);
            border: none;
            color: #ffffff;
            width: 38px;
            height: 38px;
            border-radius: 10px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
        }

        .tasks-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex-grow: 1;
            overflow-y: auto;
            padding-bottom: 20px;
        }

        /* Крупные строки задач (высота адаптирована под палец) */
        .task-item {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 16px;
            border-radius: 14px;
            cursor: pointer;
        }

        .checkbox-custom {
            width: 22px;
            height: 22px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 6px;
            margin-right: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
        }

        .task-item.completed .checkbox-custom {
            background: #ff007f;
            border-color: #ff007f;
        }

        .checkbox-custom::after {
            content: '✓';
            color: #ffffff;
            font-size: 12px;
            display: none;
            font-weight: bold;
        }

        .task-item.completed .checkbox-custom::after {
            display: block;
        }

        .task-text {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.9);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .task-item.completed .task-text {
            text-decoration: line-through;
            color: rgba(255, 255, 255, 0.3);
        }

        /* Фиксированная кнопка в самом низу экрана */
        .action-btn {
            width: 100%;
            background: linear-gradient(135deg, #00f0ff 0%, #7000ff 100%);
            border: none;
            color: #ffffff;
            padding: 16px;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(112, 0, 255, 0.3);
            margin-top: auto; /* Прижимает кнопку к низу экрана */
        }

        .action-btn:active {
            transform: scale(0.98);
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <!-- Декоративный фон -->
    <div class="bg-glow glow-1"></div>
    <div class="bg-glow glow-2"></div>

    <!-- Контейнер во весь экран -->
    <div class="app-container">
        <!-- Шапка -->
        <div class="app-header">
            <div class="app-title">Performance Hub</div>
            <div class="status-badge" id="live-indicator">Live</div>
        </div>

        <!-- Табы -->
        <div class="tabs">
            <button class="tab-btn active" id="btn-metrics">Метрики бизнеса</button>
            <button class="tab-btn" id="btn-tasks">Задачи команды</button>
        </div>

        <!-- Метрики -->
        <div class="tab-content active" id="content-metrics">
            <div class="metric-card">
                <div class="metric-info">
                    <h4>Маржинальный доход (P&L)</h4>
                    <div class="metric-value" id="pnl-text">34,500 BYN</div>
                </div>
                <div class="progress-ring-container">
                    <svg width="48" height="48">
                        <circle cx="24" cy="24" r="20" fill="transparent" stroke="rgba(255,255,255,0.05)" stroke-width="3"/>
                        <circle cx="24" cy="24" r="20" fill="transparent" stroke="#00f0ff" stroke-width="3" stroke-dasharray="125.6" stroke-dashoffset="31.4"/>
                    </svg>
                    <div class="progress-text" style="color: #00f0ff;">75%</div>
                </div>
            </div>

            <div class="metric-card">
                <div class="metric-info">
                    <h4>Эффективность команды (KPI)</h4>
                    <div class="metric-value">92.4%</div>
