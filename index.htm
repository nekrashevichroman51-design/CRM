<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <!-- Игнорируем любые попытки браузера сжать или отдалить интерфейс -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Executive Web App Fixed</title>
    <style>
        /* Базовые стили: убираем прокрутку, фиксируем экран */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #090514;
        }

        body {
            background: radial-gradient(circle at 50% 20%, #150f2e 0%, #050309 100%);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Задний план с сочным неоновым свечением */
        .bg-glow {
            position: absolute;
            width: 250px;
            height: 250px;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.35;
            z-index: 1;
        }
        .glow-1 { background: #ff007f; top: 15%; left: 10%; }
        .glow-2 { background: #00f0ff; bottom: 20%; right: 10%; }

        /* Контейнер приложения: растягивается ровно на экран телефона */
        .app-container {
            position: relative;
            z-index: 10;
            width: 100vw;
            height: 100vh;
            max-width: 450px; /* Для десктопа, на мобильном займет 100% */
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            /* Безопасная замена glassmorphism — сочный полупрозрачный темный фон */
            background: rgba(15, 11, 28, 0.75);
            border-left: 1px solid rgba(255, 255, 255, 0.06);
            border-right: 1px solid rgba(255, 255, 255, 0.06);
        }

        /* Шапка */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 24px;
        }

        .app-title {
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
            background: linear-gradient(45deg, #ffffff, #b4b2ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-badge {
            background: rgba(0, 240, 255, 0.12);
            border: 1px solid rgba(0, 240, 255, 0.4);
            color: #00f0ff;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Крупные мобильные Табы (Высота 52px под уверенное нажатие) */
        .tabs {
            display: flex;
            background: rgba(0, 0, 0, 0.45);
            padding: 4px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 24px;
            height: 52px;
            flex-shrink: 0;
        }

        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.4);
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            border-radius: 12px;
            outline: none;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .tab-btn.active {
            background: rgba(255, 255, 255, 0.12);
            color: #ffffff;
        }

        /* Контентные блоки */
        .tab-content {
            display: none;
            flex-direction: column;
            gap: 16px;
            flex-grow: 1;
        }

        .tab-content.active {
            display: flex;
        }

        /* Бизнес-метрики */
        .metric-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .metric-info h4 {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.45);
            margin-bottom: 6px;
            font-weight: 500;
        }

        .metric-value {
            font-size: 24px;
            font-weight: 700;
            color: #ffffff;
        }

        .progress-ring-container {
            position: relative;
            width: 48px;
            height: 48px;
        }

        .progress-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 11px;
            font-weight: 700;
        }

        /* Блок задач */
        .task-input-wrapper {
            display: flex;
            gap: 8px;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 16px;
            padding: 6px;
            flex-shrink: 0;
        }

        /* Шрифт 16px полностью убирает баг "дёргания" экрана на Android при вызове клавиатуры */
        .task-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 16px;
            padding-left: 12px;
        }

        .task-input::placeholder {
            color: rgba(255, 255, 255, 0.25);
        }

        .add-task-btn {
            background: linear-gradient(135deg, #00f0ff, #7000ff);
            border: none;
            color: #ffffff;
            width: 42px;
            height: 42px;
            border-radius: 12px;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
        }

        .tasks-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex-grow: 1;
            overflow-y: auto;
        }

        .task-item {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 16px;
            border-radius: 16px;
            cursor: pointer;
        }

        .checkbox-custom {
            width: 22px;
            height: 22px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 6px;
            margin-right: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
        }

        .task-item.completed .checkbox-custom {
            background: #ff007f;
            border-color: #ff007f;
        }

        .checkbox-custom::after {
            content: '✓';
            color: #ffffff;
            font-size: 13px;
            display: none;
            font-weight: bold;
        }

        .task-item.completed .checkbox-custom::after {
            display: block;
        }

        .task-text {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.9);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .task-item.completed .task-text {
            text-decoration: line-through;
            color: rgba(255, 255, 255, 0.35);
        }

        /* Главная кнопка действия */
        .action-btn {
            width: 100%;
            background: linear-gradient(135deg, #00f0ff 0%, #7000ff 100%);
            border: none;
            color: #ffffff;
            padding: 16px;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(112, 0, 255, 0.3);
            margin-top: auto; /* Жестко прижимает кнопку к низу экрана */
            flex-shrink: 0;
        }

        .action-btn:active {
            transform: scale(0.98);
            opacity: 0.95;
        }
    </style>
</head>
<body>

    <!-- Стабильный фон -->
    <div class="bg-glow glow-1"></div>
    <div class="bg-glow glow-2"></div>

    <!-- Мобильный контейнер 1:1 к экрану -->
    <div class="app-container">
        <!-- Шапка -->
        <div class="app-header">
            <div class="app-title">Performance Hub</div>
            <div class="status-badge" id="live-indicator">Live</div>
        </div>

        <!-- Переключатели вкладок -->
        <div class="tabs">
            <button class="tab-btn active" id="btn-metrics">Метрики бизнеса</button>
            <button class="tab-btn" id="btn-tasks">Задачи команды</button>
        </div>

        <!-- Панель 1: Метрики -->
        <div class="tab-content active" id="content-metrics">
            <div class="metric-card">
                <div class="metric-info">
                    <h4>Маржинальный доход (P&L)</h4>
                    <div class="metric-value" id="pnl-text">34,500 BYN</div>
                </div>
                <div class="progress-ring-container">
                    <svg width="48" height="48">
                        <circle cx="24" cy="24" r="20" fill="transparent" stroke="rgba(255,255,255,0.05)" stroke-width="3"/>
                        <circle cx="24" cy="24" r="20" fill="transparent" stroke="#00f0ff" stroke-width="3" stroke-dasharray="125.6" stroke-dashoffset="31.4"/>
                    </svg>
                    <div class="progress-text" style="color: #00f0ff;">75%</div>
                </div>
            </div>

            <div class="metric-card">
                <div class="metric-info">
                    <h4>Эффективность команды (KPI)</h4>
                    <div class="metric-value">92.4%</div>
                </div>
